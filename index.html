<!doctype html> <!-- Indica al navegador que el documento usa HTML5. -->
<html lang="en"> <!-- Abre el documento y define inicialmente su idioma. -->
  <html lang="es"> <!-- Declara el idioma espanol para el contenido de la pagina. -->
  <head> <!-- Agrupa los metadatos y recursos de configuracion. -->
    <meta charset="UTF-8" /> <!-- Permite representar correctamente caracteres Unicode. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- Define el icono de la pestana del navegador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Ajusta el ancho de la pagina a la pantalla del dispositivo. -->
    <title>wordle</title> <!-- Define un titulo para la pestana del navegador. -->
    <title>Wordle</title> <!-- Define el titulo visible de la pestana. -->
  </head>
  <body> <!-- Contiene el contenido visible de la pagina. -->
    <div id="root"></div> <!-- Proporciona el elemento donde React monta la aplicacion. -->
    <script type="module" src="/src/main.jsx"></script> <!-- Carga el punto de entrada de React como modulo. -->
  </body> <!-- Cierra el contenido del documento. -->
</html> <!-- Cierra el documento HTML. -->
